[build]
  base = "backend"
  command = "npm install && npm run build && npm --prefix ../frontend install && CLOUDFLARE_PAGES=true npm --prefix ../frontend run build"
  publish = "../frontend/out"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
